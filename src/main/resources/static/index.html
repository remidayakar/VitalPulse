<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitalPulse | Daily Health Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --accent: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.25);
            --text-main: #0f172a;
            --text-sub: #64748b;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.3s ease; }

        body {
            background: radial-gradient(circle at top right, #e0e7ff, #f8fafc);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .hero-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            text-align: center;
            max-width: 440px;
            width: 90%;
        }

        .logo-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border-radius: 16px;
            display: flex; justify-content: center; align-items: center;
            margin: 0 auto 20px auto;
            font-size: 28px;
            color: white;
            box-shadow: 0 10px 25px var(--accent-glow);
        }

        h1 { font-size: 32px; font-weight: 800; margin: 0 0 10px 0; color: var(--text-main); }
        p { color: var(--text-sub); font-size: 15px; margin-bottom: 35px; line-height: 1.6; }

        .btn-group { display: flex; flex-direction: column; gap: 14px; }

        .btn {
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            font-size: 15px;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px var(--accent-glow);
        }

        .btn-secondary {
            background: #ffffff;
            color: var(--text-main);
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }

        .btn-secondary:hover {
            background: #f1f5f9;
        }
    </style>
</head>
<body>

<div class="hero-card">
    <div class="logo-icon">⚡</div>
    <h1>VitalPulse</h1>
    <p>Track your daily steps, hydration, and calories with personal goal insights.</p>
    <div class="btn-group">
        <a href="/login.html" class="btn btn-primary">Sign In</a>
        <a href="/register.html" class="btn btn-secondary">Create Account</a>
    </div>
</div>

</body>
</html>
