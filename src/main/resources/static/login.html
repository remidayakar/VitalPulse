<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | VitalPulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.9);
            --accent: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.25);
            --text-main: #0f172a;
            --text-sub: #64748b;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.3s ease; }

        body {
            background: radial-gradient(circle at bottom left, #e0e7ff, #f8fafc);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid #e2e8f0;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            width: 380px;
            position: relative;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            padding: 6px 12px;
            border-radius: 8px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
        }

        .btn-home:hover {
            color: var(--text-main);
            background: #e2e8f0;
        }

        h2 { font-size: 26px; font-weight: 800; margin: 0 0 8px 0; text-align: center; color: var(--text-main); }
        .sub { color: var(--text-sub); font-size: 14px; text-align: center; margin-bottom: 28px; }

        .input-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }

        input {
            width: 100%;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        button:hover { transform: translateY(-2px); }

        .footer-text { text-align: center; font-size: 14px; color: var(--text-sub); margin-top: 20px; }
        .footer-text a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .msg { margin-top: 15px; text-align: center; font-size: 13px; color: #ef4444; font-weight: 600; }
    </style>
</head>
<body>

<div class="card">
    <a href="/index.html" class="btn-home">← Home</a>
    <h2>Welcome Back</h2>
    <div class="sub">Enter your details to sign in</div>

    <div class="input-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username">
    </div>
    <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>

    <button onclick="handleLogin()">Sign In</button>
    <div id="message" class="msg"></div>

    <div class="footer-text">
        Don't have an account? <a href="/register.html">Sign Up</a>
    </div>
</div>

<script>
    async function handleLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
            document.getElementById('message').innerText = 'Please enter credentials';
            return;
        }

        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        if (res.ok) {
            const user = await res.json();
            localStorage.setItem('userId', user.id);
            localStorage.setItem('username', user.username);
            localStorage.setItem('role', user.role);

            if (user.role === 'MENTOR') {
                window.location.href = '/mentor-dashboard.html';
            } else {
                window.location.href = '/dashboard.html';
            }
        } else {
            document.getElementById('message').innerText = 'Invalid username or password';
        }
    }
</script>

</body>
</html>
